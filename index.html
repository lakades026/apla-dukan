<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>APLA DUKAN - 151000 FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#111;color:#fff;font-family:Arial}
.top{background:#000;padding:10px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:99;border-bottom:2px solid red}
.logo{color:red;font-size:20px;font-weight:900}
.search{flex:1;padding:8px;background:#222;border:1px solid #555;color:#fff;border-radius:20px}
.btn{background:red;color:#fff;padding:8px 12px;border:none;border-radius:20px;font-weight:bold}
.bar{background:#222;padding:8px;display:flex;gap:6px;overflow:auto}
.bar button{padding:8px 12px;background:#333;color:#fff;border:none;border-radius:20px;white-space:nowrap}
.yellow{background:#ff0;color:#000;text-align:center;padding:8px;font-weight:bold;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.card{background:#222;border-radius:8px;padding:10px;border:1px solid #333}
.card.hot{border:2px solid #ff0;background:#332200}
.num{background:red;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;display:inline-block}
.num.hot{background:#ff0;color:#000}
.card h4{font-size:13px;margin:6px 0;min-height:36px}
.price{color:#0f0;font-weight:bold}
.card button{width:100%;padding:6px;background:#fff;color:#000;border:none;border-radius:5px;font-weight:bold;margin-top:6px}
</style>
</head>
<body>
<div class="top">
<div class="logo">APLA DUKAN</div>
<input id="search" class="search" placeholder="Khojo - 191 likho">
<button class="btn" onclick="openCart()">Cart <span id="cnt">0</span></button>
</div>
<div class="bar">
<button onclick="goTo(1)">#1 Start</button>
<button onclick="goTo(191)">🔥 #191 Rs23</button>
<button onclick="goTo(1000)">#1000</button>
<button onclick="goTo(10000)">#10000</button>
<button onclick="goTo(50000)">#50000</button>
<button onclick="goTo(100000)">#1 Lakh</button>
</div>
<div class="yellow" id="info">Total 1,51,000 - Abhi #1 se #200 dikh rahe - Scroll karo</div>
<div id="grid" class="grid"></div>
<div style="text-align:center;padding:20px;color:#888" id="more">Scroll karo neeche - Aur 200 load honge...</div>

<script>
var all=[];
for(var i=1;i<=151000;i++){
var n="Product "+i+" 1 Kilo";
var p=50+(i%300);
if(i==191){n="Parachute Tel 500ML SPECIAL";p=23;}
if(i==192){n="Parachute Tel 1 Liter";p=250;}
if(i==193){n="Toor Dal 1 Kilo";p=120;}
if(i==194){n="Kaju Katli 8 Pieces";p=250;}
if(i==195){n="Fortune Oil 1 Liter";p=135;}
if(i==196){n="Sugar 1 Kilo";p=42;}
if(i==197){n="Aashirvaad Atta 10 Kilo";p=420;}
all.push({no:i,name:n,price:p});
}
var cart=[];
var start=0;
var count=200;
var filtered=null;

function getData(){return filtered?filtered:all;}

function render(reset){
if(reset){start=0;document.getElementById('grid').innerHTML="";}
var data=getData();
var end=Math.min(start+count,data.length);
var html="";
for(var i=start;i<end;i++){
var item=data[i];
var isHot=item.no==191;
html+='<div class="card '+(isHot?'hot':'')+'"><div class="num '+(isHot?'hot':'')+'">#'+item.no+(isHot?' HOT':'')+'</div><h4>'+item.name+'</h4><div class="price">Rs '+item.price+'</div><button onclick="add('+item.no+')">Add #'+item.no+'</button></div>';
}
document.getElementById('grid').innerHTML+=html;
document.getElementById('info').innerText='Total '+data.length+' / 1,51,000 - Dikh rahe #'+(data[start]?data[start].no:0)+' se #'+(data[end-1]?data[end-1].no:0);
start=end;
if(start>=data.length){document.getElementById('more').innerText="✅ Sab "+data.length+" dikh gaye";}
else{document.getElementById('more').innerText="Scroll karo - Aur 200 load honge... "+start+" / "+data.length;}
}

function goTo(n){
filtered=null;
document.getElementById('search').value="";
document.getElementById('grid').innerHTML="";
start=n-1;
if(start<0)start=0;
if(start>all.length-1)start=all.length-200;
render(false);
window.scrollTo(0,0);
}

document.getElementById('search').addEventListener('input',function(){
var q=this.value.trim().toLowerCase();
if(q==""){filtered=null;document.getElementById('grid').innerHTML="";start=0;render(false);return;}
if(!isNaN(q)){var num=parseInt(q);if(num>=1&&num<=151000){filtered=[all[num-1]];document.getElementById('grid').innerHTML="";start=0;render(false);return;}}
var res=[];
for(var i=0;i<all.length;i++){if(all[i].name.toLowerCase().indexOf(q)!=-1){res.push(all[i]);if(res.length>2000)break;}}
