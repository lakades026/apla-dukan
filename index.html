<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>APLA DUKAN - ML KILO PIECES SYSTEM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#111;color:#fff;font-family:Arial}
.top{position:sticky;top:0;z-index:99;background:#000;padding:10px;display:flex;gap:6px;align-items:center;border-bottom:2px solid red}
.logo{color:red;font-size:18px;font-weight:900}
.search{flex:1;padding:8px 12px;border-radius:20px;background:#222;border:1px solid #555;color:#fff}
.btn{background:red;color:#fff;padding:8px 12px;border:none;border-radius:20px;font-weight:bold}
.bar{padding:8px;background:#1a1a1a;display:flex;gap:6px;overflow:auto}
.bar button{padding:7px 12px;background:#333;color:#fff;border:none;border-radius:20px;white-space:nowrap;font-size:12px}
.bar button.active{background:#fff;color:#000}
.yellow{background:#ff0;color:#000;text-align:center;padding:8px;font-weight:bold;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.card{background:#222;border-radius:8px;padding:10px;border:1px solid #333;position:relative}
.card.hot{border:2px solid gold;background:#332200}
.num{font-size:9px;background:red;color:#fff;padding:2px 6px;border-radius:10px;display:inline-block}
.card h4{font-size:13px;margin:4px 0;min-height:30px;line-height:1.2}
.unit-badge{display:inline-block;background:#444;color:#ff0;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:4px;margin:2px 0;border:1px solid #666}
.price{color:#0f0;font-weight:bold;font-size:14px;margin-top:4px}
.mrp{color:#888;text-decoration:line-through;font-size:10px}
.card button{width:100%;padding:6px;background:#fff;color:#000;border:none;border-radius:5px;font-weight:bold;margin-top:6px;font-size:12px}
.next{width:95%;margin:10px auto;display:block;padding:12px;background:red;color:#fff;border:none;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<div class="top">
<div class="logo">APLA DUKAN</div>
<input id="search" class="search" placeholder="500ML, Kilo, Pieces, 191 likho">
<button class="btn" onclick="openCart()">Cart <span id="cnt">0</span></button>
</div>
<div class="bar" id="bar">
<button onclick="filterUnit('ALL')" class="active">ALL</button>
<button onclick="filterUnit('ML')">500 ML Wale</button>
<button onclick="filterUnit('Liter')">Liter Wale</button>
<button onclick="filterUnit('Kilo')">Kilo Wale</button>
<button onclick="filterUnit('Pieces')">Pieces Wale</button>
<button onclick="goTo(191)">🔥 #191 Rs23</button>
</div>
<div class="yellow" id="info">Sahi System - Naam + ML/Kilo/Pieces + Rate - Total 1,51,000</div>
<div id="grid" class="grid"></div>
<button class="next" onclick="more()">👇 Aur 200 Dikhao</button>

<div id="cartBox" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:999;padding:15px;overflow:auto">
<div style="background:#fff;color:#000;max-width:400px;margin:20px auto;border-radius:12px;padding:15px">
<h2>Order List</h2><div id="cartList" style="margin:10px 0"></div>
<button onclick="sendWA()" style="width:100%;padding:12px;background:#25D366;color:#fff;border:none;border-radius:8px;font-weight:bold">WhatsApp Order - 7415698590</button>
<button onclick="document.getElementById('cartBox').style.display='none'" style="width:100%;padding:10px;background:#eee;border:none;border-radius:8px;margin-top:8px">Band Karo</button>
</div></div>

<script>
// FINAL SAHI SYSTEM - NAAM + ML/KILO/PIECES + RATE
var all=[];
var baseData=[
["Parachute Tel",500,"ML",23,"Cosmetics","🥥"],
["Parachute Tel",1,"Liter",250,"Cosmetics","🥥"],
["Fortune Sarso Tel",1,"Liter",135,"Kirana","🛢️"],
["Fortune Oil",5,"Liter",650,"Kirana","🛢️"],
["Toor Dal",1,"Kilo",120,"Kirana","🌾"],
["Moong Dal",1,"Kilo",110,"Kirana","🌾"],
["Chana Dal",1,"Kilo",95,"Kirana","🌾"],
["Sugar",1,"Kilo",42,"Kirana","🧂"],
["Tata Salt",1,"Kilo",28,"Kirana","🧂"],
["Aashirvaad Atta",10,"Kilo",420,"Kirana","🌾"],
["Kaju Katli",8,"Pieces",250,"Mithai","🍬"],
["Kaju Katli",16,"Pieces",480,"Mithai","🍬"],
["Maggi",8,"Pieces",96,"Kirana","🍜"],
["Parle-G",10,"Pieces",100,"Kirana","🍪"],
["Coca Cola",2,"Liter",90,"Cold Drink","🥤"],
["Colgate",2,"Pieces",85,"Cosmetics","🪥"],
["Surf Excel",1,"Kilo",95,"Kirana","🧼"]
];

for(var i=1;i<=151000;i++){
var b=baseData[i % baseData.length];
var base=b[0], qty=b[1], unit=b[2], price=b[3], cat=b[4], icon=b[5];
if(i==191){base="Parachute Tel";qty=500;unit="ML";price=23;cat="Cosmetics";icon="🥥";}
if(i==192){base="Parachute Tel";qty=1;unit="Liter";price=250;cat="Cosmetics";icon="🥥";}
if(i==193){base="Toor Dal";qty=1;unit="Kilo";price=120;cat="Kirana";icon="🌾";}
if(i==194){base="Kaju Katli";qty=8;unit="Pieces";price=250;cat="Mithai";icon="🍬";}
if(i==195){base="Fortune Oil";qty=1;unit="Liter";price=135;cat="Kirana";icon="🛢️";}
var fullName=base+" - "+qty+" "+unit;
all.push({no:i,base:base,fullName:fullName,qty:qty,unit:unit,price:price,mrp:price+30,cat:cat,icon:icon});
}

var cart=[]; var start=0; var step=200; var filtered=null; var curUnit='ALL';

function getData(){return filtered?filtered:all;}

function render(reset){
if(reset){start=0;document.getElementById('grid').innerHTML="";}
var data=getData();
var end=start+step; if(end>data.length)end=data.length;
var html="";
for(var i=start;i<end;i++){
var p=data[i];
var hot=p.no==191;
html+='<div class="card '+(hot?'hot':'')+'"><div class="num">#'+p.no+(hot?' HOT':'' )+'</div><div style="font-size:20px">'+p.icon+'</div><h4>'+p.base+'</h4><div class="unit-badge">'+p.qty+' '+p.unit+'</div><div style="font-size:10px;color:#aaa">'+p.cat+'</div><div class="price">₹'+p.price+' <span class="mrp">₹'+p.mrp+'</span></div><button onclick="add('+p.no+')">Add #'+p.no+'</button></div>';
}
document.getElementById('grid').innerHTML+=html;
document.getElementById('info').innerHTML='Total '+data.length+' - '+curUnit+' - Dikh rahe #'+(data[start]?data[start].no:0)+' se #'+(data[end-1]?data[end-1].no:0)+' | '+curUnit+' System';
start=end;
}

function more(){render(false);}
function goTo(n){filtered=null;curUnit='ALL';document.getElementById('grid').innerHTML="";start=n-1;render(false);window.scrollTo(0,0);}
function filterUnit(u){
curUnit=u;
document.querySelectorAll('.bar button').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
if(u=='ALL'){filtered=null;} else {filtered=all.filter(p=>p.unit==u);}
document.getElementById('grid').innerHTML="";start=0;render(false);
}

document.getElementById('search').addEventListener('input',function(){
var q=this.value.trim().toLowerCase();
if(q==""){filtered=null;curUnit='ALL';document.getElementById('grid').innerHTML="";start=0;render(false);return;}
if(!isNaN(q)){var n=parseInt(q);if(n>=1&&n<=151000){filtered=[all[n-1]];document.getElementById('grid').innerHTML="";start=0;render(false);return;}}
var res=[];
for(var i=0;i<all.length;i++){if(all[i].fullName.toLowerCase().indexOf(q)!=-1 || all[i].unit.toLowerCase().indexOf(q)!=-1){res.push(all[i]);if(res.length>2000)break;}}
filtered=res;document.getElementById('grid').innerHTML="";start=0;render(false);
});

function add(no){var p=all[no-1];cart.push(p);document.getElementById('cnt').innerHTML=cart.length;}
function openCart(){
if(cart.length==0){alert("Pehle Add karo");return;}
var h="";var tot=0;
for(var i=0;i<cart.length;i++){tot+=cart[i].price;h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee"><span>#'+cart[i].no+' '+cart[i].fullName+' ₹'+cart[i].price+'</span><span onclick="cart.splice('+i+',1);document.getElementById(\'cnt\').innerHTML=cart.length;openCart()" style="color:red">X</span></div>';}
h+='<b>Total: ₹'+tot+'</b>';
document.getElementById('cartList').innerHTML=h;
document.getElementById('cartBox').style.display='block';
}
function sendWA(){
var list="";var tot=0;
for(var i=0;i<cart.length;i++){list+=(i+1)+". #"+cart[i].no+" "+cart[i].fullName+" ₹"+cart[i].price+"%0A";tot+=cart[i].price;}
var msg="*APLA DUKAN - ML/KILO/PIECES ORDER*%0A%0A"+list+"%0ATotal: ₹"+tot;
window.open("https://wa.me/917415698590?text="+msg,"_blank");
}

render(false);
</script>
</body></html>
